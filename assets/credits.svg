<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Thanks for crawling</title>
  <desc id="d">Three pixel crawler bots celebrate on a ranking podium under falling confetti. MIT, free forever.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040b08"/><stop offset=".65" stop-color="#08190f"/><stop offset="1" stop-color="#0d2c20"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3ee6b0" stroke-opacity=".055"/></pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2fff8"/><stop offset=".6" stop-color="#d9ffc0"/><stop offset="1" stop-color="#b6f23c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="bot" viewBox="0 0 32 32">
      <rect x="14" y="0" width="4" height="4" fill="currentColor"/>
      <rect x="4" y="4" width="24" height="16" fill="currentColor"/>
      <rect x="9" y="9" width="4" height="5" fill="#07120e"/>
      <rect x="19" y="9" width="4" height="5" fill="#07120e"/>
      <rect x="2" y="20" width="4" height="8" fill="currentColor"/><rect x="10" y="20" width="4" height="6" fill="currentColor"/>
      <rect x="18" y="20" width="4" height="8" fill="currentColor"/><rect x="26" y="20" width="4" height="6" fill="currentColor"/>
    </symbol>
    <radialGradient id="spot" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#b6f23c" stop-opacity=".28"/>
      <stop offset="1" stop-color="#b6f23c" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      @keyframes hop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-14px)}}
      .hop{animation:hop 1.8s ease-in-out infinite}
      @keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(320px) rotate(360deg)}}
      .cf{transform-box:fill-box;transform-origin:center;animation:fall 4s linear infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .star{animation:tw 3s ease-in-out infinite}
      @keyframes shine{0%,100%{opacity:.5}50%{opacity:1}}
      .shine{animation:shine 1.4s ease-in-out infinite}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .blink{animation:blink 1.2s steps(1) infinite}
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#sky)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect width="1200" height="380" fill="url(#vig)"/>
  <g fill="#9fe6c4">
    <rect class="star" x="640" y="60" width="3" height="3"/><rect class="star" x="900" y="40" width="3" height="3" style="animation-delay:-1s"/>
    <rect class="star" x="1100" y="120" width="3" height="3" style="animation-delay:-2s"/><rect class="star" x="760" y="250" width="3" height="3" style="animation-delay:-.5s"/>
    <rect class="star" x="1150" y="300" width="3" height="3" style="animation-delay:-1.6s"/>
  </g>


  <!-- pixel mountains -->
  <path d="M480 330 V290 h24 v-16 h24 v-20 h24 v-24 h24 v20 h24 v-14 h24 v30 h24 v-22 h24 v-18 h24 v28 h24 v16 h24 v-26 h24 v-20 h24 v30 h24 v18 h24 v-14 h24 v24 h24 v14 h24 v-18 h24 v24 h24 V330 Z" fill="#0c241a"/>
  <path d="M600 330 V304 h24 v-12 h24 v-18 h24 v16 h24 v-10 h24 v20 h24 v-8 h24 v14 h24 v-20 h24 v-12 h24 v24 h24 v10 h24 v-16 h24 v22 h24 v-8 h24 v14 h24 V330 Z" fill="#103022"/>
  <!-- glowing #1 moon -->
  <g class="shine" filter="url(#glow)">
    <circle cx="1080" cy="86" r="38" fill="#eef7e2"/>
    <circle cx="1068" cy="74" r="6" fill="#d7e8c6"/><circle cx="1096" cy="104" r="5" fill="#d7e8c6"/>
  </g>
  <text x="1080" y="98" class="mono" font-size="30" font-weight="900" fill="#0d2c20" text-anchor="middle">#1</text>
  <!-- fireflies -->
  <g fill="#b6f23c" filter="url(#glow)">
    <rect class="star" x="560" y="200" width="4" height="4"/><rect class="star" x="1010" y="230" width="4" height="4" style="animation-delay:-1.2s"/>
    <rect class="star" x="720" y="160" width="4" height="4" style="animation-delay:-2.1s"/><rect class="star" x="1160" y="200" width="4" height="4" style="animation-delay:-.7s"/>
  </g>

  <text x="56" y="52" class="mono" font-size="11" letter-spacing="3" fill="#b6f23c">CREDITS</text>
  <text x="56" y="90" class="mono" font-size="28" font-weight="800" letter-spacing="5" fill="#eafff4">THANKS FOR CRAWLING<tspan class="blink" fill="#b6f23c">_</tspan></text>
  <text x="56" y="116" class="mono" font-size="11" letter-spacing="4" fill="#6f9c86">RANKINGS SAVED</text>

  <!-- spotlight + podium -->
  <ellipse cx="300" cy="330" rx="260" ry="150" fill="url(#spot)"/>
  <g class="mono" font-weight="800" text-anchor="middle">
    <rect x="190" y="270" width="70" height="60" fill="#10281e" stroke="#3ee6b0" stroke-width="3"/><text x="225" y="308" font-size="22" fill="#3ee6b0">2</text>
    <rect x="265" y="240" width="70" height="90" fill="#10281e" stroke="#b6f23c" stroke-width="3"/><text x="300" y="286" font-size="26" fill="#b6f23c">1</text>
    <rect x="340" y="290" width="70" height="40" fill="#10281e" stroke="#ffb020" stroke-width="3"/><text x="375" y="318" font-size="20" fill="#ffb020">3</text>
  </g>

  <!-- trophy -->
  <g class="shine" transform="translate(400,170)" fill="#ffb020" filter="url(#glow)">
    <rect x="0" y="0" width="28" height="6"/><rect x="2" y="6" width="24" height="14"/><rect x="-6" y="4" width="6" height="10"/><rect x="28" y="4" width="6" height="10"/>
    <rect x="10" y="20" width="8" height="8"/><rect x="4" y="28" width="20" height="5"/>
  </g>

  <!-- bots -->
  <g class="hop" style="animation-delay:-.3s"><use href="#bot" x="209" y="236" width="32" height="32" color="#3ee6b0"/></g>
  <g class="hop"><use href="#bot" x="280" y="200" width="40" height="40" color="#b6f23c"/></g>
  <g class="hop" style="animation-delay:-.6s"><use href="#bot" x="359" y="256" width="32" height="32" color="#ffb020"/></g>

  <!-- confetti -->
  <g>
    <rect class="cf" x="150" y="0" width="6" height="6" fill="#b6f23c"/>
    <rect class="cf" x="230" y="0" width="5" height="8" fill="#3ee6b0" style="animation-delay:-1s"/>
    <rect class="cf" x="300" y="0" width="6" height="6" fill="#ffb020" style="animation-delay:-2.2s"/>
    <rect class="cf" x="360" y="0" width="5" height="8" fill="#ff6b5a" style="animation-delay:-.6s"/>
    <rect class="cf" x="430" y="0" width="6" height="6" fill="#b6f23c" style="animation-delay:-3s"/>
    <rect class="cf" x="190" y="0" width="5" height="5" fill="#ffb020" style="animation-delay:-1.7s"/>
    <rect class="cf" x="400" y="0" width="5" height="8" fill="#3ee6b0" style="animation-delay:-2.7s"/>
    <rect class="cf" x="270" y="0" width="5" height="5" fill="#ff6b5a" style="animation-delay:-3.4s"/>
  </g>

  <rect x="0" y="330" width="1200" height="2" fill="#2c5a47"/>
  <text x="300" y="362" class="mono" font-size="10" fill="#6f9c86" text-anchor="middle">github.com/prikshitmaster/Genius-seo</text>

  <!-- right side -->
  <text x="890" y="150" class="mono" font-size="10" letter-spacing="4" fill="#6f9c86" text-anchor="middle">LICENSE</text>
  <text x="890" y="172" class="sans" font-size="15" font-weight="700" fill="#3ee6b0" text-anchor="middle">MIT, free forever</text>
  <text x="890" y="232" class="mono" font-size="11" letter-spacing="4" fill="#ffb020" text-anchor="middle">NEXT UP</text>
  <text x="890" y="272" class="sans" font-size="34" font-weight="900" fill="url(#ink)" filter="url(#soft)" text-anchor="middle">YOUR FIRST #1</text>
</svg>
