<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Research-backed: Google, Bing, Ahrefs, Semrush and NN/g feed the playbook</title>
  <desc id="d">Five research sources send data pulses into the genius-seo core, which outputs three results: rank in Google, get cited by AI, and convert readers into clients.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040b08"/><stop offset=".65" stop-color="#08190f"/><stop offset="1" stop-color="#0d2c20"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3ee6b0" stroke-opacity=".055"/></pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b6f23c" stop-opacity=".55"/><stop offset="1" stop-color="#b6f23c" stop-opacity="0"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2fff8"/><stop offset=".6" stop-color="#d9ffc0"/><stop offset="1" stop-color="#b6f23c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="bot" viewBox="0 0 32 32">
      <rect x="14" y="0" width="4" height="4" fill="currentColor"/>
      <rect x="4" y="4" width="24" height="16" fill="currentColor"/>
      <rect x="9" y="9" width="4" height="5" fill="#07120e"/><rect x="19" y="9" width="4" height="5" fill="#07120e"/>
      <rect x="2" y="20" width="4" height="8" fill="currentColor"/><rect x="10" y="20" width="4" height="6" fill="currentColor"/>
      <rect x="18" y="20" width="4" height="8" fill="currentColor"/><rect x="26" y="20" width="4" height="6" fill="currentColor"/>
    </symbol>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .star{animation:tw 3.2s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-40}}
      .wire{stroke-dasharray:4 6;animation:dash 1.6s linear infinite}
      @keyframes pulse{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
      .core{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .ring{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
      @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
      .tile{animation:blink 2.5s ease-in-out infinite}
      @keyframes walk{from{transform:translateX(-60px)}to{transform:translateX(1260px)}}
      .walker{animation:walk 22s linear infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      .bob{animation:bob .6s steps(2) infinite}
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#vig)"/>
  <g fill="#9fe6c4">
    <rect class="star" x="420" y="40" width="3" height="3"/><rect class="star" x="760" y="60" width="3" height="3" style="animation-delay:-1s"/>
    <rect class="star" x="1150" y="30" width="3" height="3" style="animation-delay:-2s"/><rect class="star" x="300" y="330" width="3" height="3" style="animation-delay:-.6s"/>
  </g>

  <text x="56" y="52" class="mono" font-size="12" letter-spacing="3" fill="#b6f23c">RESEARCH-BACKED</text>
  <text x="56" y="88" class="sans" font-size="30" font-weight="800" fill="url(#ink)" filter="url(#soft)">Built on what the leaders publish</text>

  <!-- sources -->
  <g class="mono" font-size="12" font-weight="700" text-anchor="middle">
    <g class="tile"><rect x="56" y="118" width="150" height="38" rx="4" fill="#0d2019" stroke="#b6f23c" stroke-width="2"/><text x="131" y="142" fill="#b6f23c">GOOGLE</text></g>
    <g class="tile" style="animation-delay:-.5s"><rect x="56" y="166" width="150" height="38" rx="4" fill="#0d2019" stroke="#3ee6b0" stroke-width="2"/><text x="131" y="190" fill="#3ee6b0">BING · COPILOT</text></g>
    <g class="tile" style="animation-delay:-1s"><rect x="56" y="214" width="150" height="38" rx="4" fill="#0d2019" stroke="#ffb020" stroke-width="2"/><text x="131" y="238" fill="#ffb020">AHREFS</text></g>
    <g class="tile" style="animation-delay:-1.5s"><rect x="56" y="262" width="150" height="38" rx="4" fill="#0d2019" stroke="#ff6b5a" stroke-width="2"/><text x="131" y="286" fill="#ff6b5a">SEMRUSH</text></g>
    <g class="tile" style="animation-delay:-2s"><rect x="56" y="310" width="150" height="38" rx="4" fill="#0d2019" stroke="#9fc9b4" stroke-width="2"/><text x="131" y="334" fill="#9fc9b4">NN/g</text></g>
  </g>

  <!-- wires in -->
  <g fill="none" stroke-width="2">
    <path class="wire" d="M206 137 C 330 137, 380 220, 520 228" stroke="#b6f23c"/>
    <path class="wire" d="M206 185 C 330 185, 380 224, 520 230" stroke="#3ee6b0"/>
    <path class="wire" d="M206 233 L 520 232" stroke="#ffb020"/>
    <path class="wire" d="M206 281 C 330 281, 380 240, 520 234" stroke="#ff6b5a"/>
    <path class="wire" d="M206 329 C 330 329, 380 244, 520 236" stroke="#9fc9b4"/>
  </g>
  <!-- data pulses -->
  <g filter="url(#glow)">
    <circle r="4" fill="#b6f23c"><animateMotion dur="2.6s" repeatCount="indefinite" path="M206 137 C 330 137, 380 220, 520 228"/></circle>
    <circle r="4" fill="#3ee6b0"><animateMotion dur="2.6s" begin="-.5s" repeatCount="indefinite" path="M206 185 C 330 185, 380 224, 520 230"/></circle>
    <circle r="4" fill="#ffb020"><animateMotion dur="2.6s" begin="-1s" repeatCount="indefinite" path="M206 233 L 520 232"/></circle>
    <circle r="4" fill="#ff6b5a"><animateMotion dur="2.6s" begin="-1.6s" repeatCount="indefinite" path="M206 281 C 330 281, 380 240, 520 234"/></circle>
    <circle r="4" fill="#9fc9b4"><animateMotion dur="2.6s" begin="-2.1s" repeatCount="indefinite" path="M206 329 C 330 329, 380 244, 520 236"/></circle>
  </g>

  <!-- core -->
  <circle cx="600" cy="232" r="110" fill="url(#core)"/>
  <g class="ring"><circle cx="600" cy="232" r="84" fill="none" stroke="#3ee6b0" stroke-width="2" stroke-dasharray="6 10"/></g>
  <g class="core" filter="url(#glow)">
    <rect x="520" y="182" width="160" height="100" rx="10" fill="#0d2019" stroke="#b6f23c" stroke-width="3"/>
  </g>
  <text x="600" y="224" class="sans" font-size="20" font-weight="800" fill="url(#ink)" text-anchor="middle">genius-seo</text>
  <text x="600" y="248" class="mono" font-size="10" letter-spacing="2" fill="#9fc9b4" text-anchor="middle">8 RESEARCH GUIDES</text>
  <text x="600" y="266" class="mono" font-size="10" letter-spacing="2" fill="#6f9c86" text-anchor="middle">SOURCES CHECKED</text>

  <!-- outputs -->
  <g fill="none" stroke-width="2">
    <path class="wire" d="M680 222 C 760 222, 780 150, 860 150" stroke="#b6f23c"/>
    <path class="wire" d="M680 232 L 860 232" stroke="#3ee6b0"/>
    <path class="wire" d="M680 242 C 760 242, 780 314, 860 314" stroke="#ffb020"/>
  </g>
  <g class="mono">
    <g transform="translate(860,124)">
      <rect width="290" height="52" rx="4" fill="#0d2019" stroke="#b6f23c" stroke-width="2"/>
      <text x="16" y="22" font-size="13" font-weight="700" fill="#b6f23c">RANK IN GOOGLE</text>
      <text x="16" y="40" font-size="10" fill="#9fc9b4">intent · people-first · links</text>
      <rect x="196" y="18" width="80" height="8" fill="#12291f"/><rect x="196" y="18" width="0" height="8" fill="#b6f23c"><animate attributeName="width" values="0;80;80;0" keyTimes="0;.45;.95;1" dur="6s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(860,206)">
      <rect width="290" height="52" rx="4" fill="#0d2019" stroke="#3ee6b0" stroke-width="2"/>
      <text x="16" y="22" font-size="13" font-weight="700" fill="#3ee6b0">GET CITED BY AI</text>
      <text x="16" y="40" font-size="10" fill="#9fc9b4">mentions · YouTube · clear answers</text>
      <rect x="196" y="18" width="80" height="8" fill="#12291f"/><rect x="196" y="18" width="0" height="8" fill="#3ee6b0"><animate attributeName="width" values="0;0;80;80;0" keyTimes="0;.15;.6;.95;1" dur="6s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(860,288)">
      <rect width="290" height="52" rx="4" fill="#0d2019" stroke="#ffb020" stroke-width="2"/>
      <text x="16" y="22" font-size="13" font-weight="700" fill="#ffb020">CONVERT TO CLIENTS</text>
      <text x="16" y="40" font-size="10" fill="#9fc9b4">one ask · trust · tracked leads</text>
      <rect x="196" y="18" width="80" height="8" fill="#12291f"/><rect x="196" y="18" width="0" height="8" fill="#ffb020"><animate attributeName="width" values="0;0;80;80;0" keyTimes="0;.3;.75;.95;1" dur="6s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ground + bot -->
  <rect x="0" y="372" width="1200" height="2" fill="#2c5a47"/>
  <g transform="translate(0,340)"><g class="walker"><g class="bob"><use href="#bot" width="32" height="32" color="#b6f23c"/></g></g></g>
  <text x="1144" y="392" class="mono" font-size="9" letter-spacing="2" fill="#6f9c86" text-anchor="end">BRAND NAMES BELONG TO THEIR OWNERS</text>
</svg>
