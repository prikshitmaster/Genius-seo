<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">12 commands, five stops</title>
  <desc id="d">A crawler bot walks a route through five stops: Plan, Write, AI Search, Grow and Measure. Each stop is checked off as it passes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040b08"/><stop offset=".65" stop-color="#08190f"/><stop offset="1" stop-color="#0d2c20"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3ee6b0" stroke-opacity=".055"/></pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2fff8"/><stop offset=".6" stop-color="#d9ffc0"/><stop offset="1" stop-color="#b6f23c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="bot" viewBox="0 0 32 32">
      <rect x="14" y="0" width="4" height="4" fill="currentColor"/>
      <rect x="4" y="4" width="24" height="16" fill="currentColor"/>
      <rect x="9" y="9" width="4" height="5" fill="#07120e"/>
      <rect x="19" y="9" width="4" height="5" fill="#07120e"/>
      <rect x="2" y="20" width="4" height="8" fill="currentColor"/><rect x="10" y="20" width="4" height="6" fill="currentColor"/>
      <rect x="18" y="20" width="4" height="8" fill="currentColor"/><rect x="26" y="20" width="4" height="6" fill="currentColor"/>
    </symbol>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      @keyframes dash{to{stroke-dashoffset:-36}}
      .route{stroke-dasharray:6 6;animation:dash 1.5s linear infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .star{animation:tw 3s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#sky)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect width="1200" height="380" fill="url(#vig)"/>
  <g fill="#9fe6c4">
    <rect class="star" x="120" y="90" width="3" height="3"/><rect class="star" x="520" y="70" width="3" height="3" style="animation-delay:-1s"/>
    <rect class="star" x="820" y="110" width="3" height="3" style="animation-delay:-2s"/><rect class="star" x="300" y="340" width="3" height="3" style="animation-delay:-.6s"/>
  </g>

  <text x="60" y="46" class="mono" font-size="12" letter-spacing="3" fill="#b6f23c">COMMANDS</text>
  <text x="60" y="80" class="sans" font-size="28" font-weight="800" fill="#eafff4">12 commands, five stops</text>

  <!-- island -->
  <path d="M50 150 L80 120 L790 118 L830 150 L840 300 L800 340 L70 342 L40 300 Z" fill="#10281e" stroke="#1f4636" stroke-width="3"/>

  <path class="route" filter="url(#glow)" d="M110 270 L270 180 L430 270 L590 180 L750 270" fill="none" stroke="#b6f23c" stroke-width="3"/>

  <!-- stops -->
  <g class="mono" font-size="11" letter-spacing="2" text-anchor="middle">
    <g transform="translate(110,270)"><rect x="-26" y="-26" width="52" height="52" fill="#0d2019" stroke="#b6f23c" stroke-width="3"/><circle cx="-3" cy="-3" r="11" fill="none" stroke="#b6f23c" stroke-width="4"/><rect x="5" y="5" width="12" height="5" fill="#b6f23c" transform="rotate(45 5 5)"/><text y="46" fill="#eafff4">PLAN · 4</text></g>
    <g transform="translate(270,180)"><rect x="-26" y="-26" width="52" height="52" fill="#0d2019" stroke="#3ee6b0" stroke-width="3"/><g fill="#3ee6b0"><rect x="-14" y="-14" width="28" height="4"/><rect x="-14" y="-5" width="22" height="4"/><rect x="-14" y="4" width="26" height="4"/></g><text y="-38" fill="#eafff4">WRITE · 2</text></g>
    <g transform="translate(430,270)"><rect x="-26" y="-26" width="52" height="52" fill="#0d2019" stroke="#3ee6b0" stroke-width="3"/><text y="7" font-size="18" font-weight="700" fill="#3ee6b0">AI</text><text y="46" fill="#eafff4">AI SEARCH · 2</text></g>
    <g transform="translate(590,180)"><rect x="-26" y="-26" width="52" height="52" fill="#0d2019" stroke="#ffb020" stroke-width="3"/><g fill="#ffb020"><rect x="-14" y="2" width="7" height="12"/><rect x="-3" y="-6" width="7" height="20"/><rect x="8" y="-14" width="7" height="28"/></g><text y="-38" fill="#eafff4">GROW · 2</text></g>
    <g transform="translate(750,270)"><rect x="-26" y="-26" width="52" height="52" fill="#0d2019" stroke="#ffb020" stroke-width="3"/><path d="M-14 10 L-4 -2 L4 4 L14 -12" fill="none" stroke="#ffb020" stroke-width="4"/><text y="46" fill="#eafff4">MEASURE · 2</text></g>
  </g>

  <!-- checkmarks synced to the bot -->
  <g class="mono" font-size="11" letter-spacing="1" fill="#b6f23c" text-anchor="middle">
    <text x="110" y="332" opacity="0">✓ DONE<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.01;.97;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="270" y="128" opacity="0">✓ DONE<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.21;.97;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="430" y="332" opacity="0">✓ DONE<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.41;.97;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="590" y="128" opacity="0">✓ DONE<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.6;.61;.97;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="750" y="332" opacity="0">✓ DONE<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.8;.81;.97;1" dur="10s" repeatCount="indefinite"/></text>
  </g>

  <!-- walking bot -->
  <use filter="url(#soft)" href="#bot" x="-16" y="-44" width="32" height="32" color="#b6f23c">
    <animateMotion path="M110 270 L270 180 L430 270 L590 180 L750 270" keyPoints="0;1;1" keyTimes="0;.8;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
  </use>

  <!-- right card -->
  <g transform="translate(880,110)">
    <rect width="270" height="232" rx="4" fill="#eef7e2"/>
    <rect x="10" y="10" width="250" height="212" fill="none" stroke="#07120e" stroke-width="2"/>
    <text x="135" y="58" class="mono" font-size="11" letter-spacing="3" fill="#1d3a2e" text-anchor="middle">ALL FIVE STOPS</text>
    <text x="135" y="112" class="sans" font-size="30" font-weight="900" fill="#07120e" text-anchor="middle">12 commands</text>
    <text x="135" y="138" class="sans" font-size="14" fill="#1d3a2e" text-anchor="middle">one plugin</text>
    <rect x="40" y="152" width="190" height="2" fill="#1d3a2e" opacity=".3"/>
    <text x="135" y="176" class="mono" font-size="12" fill="#1f7a3a" text-anchor="middle">start with /genius-seo:start</text>
    <rect x="24" y="196" width="222" height="10" fill="#cfe3c0"/>
    <rect x="24" y="196" width="0" height="10" fill="#3fb950"><animate attributeName="width" values="0;222;222;0" keyTimes="0;.8;.97;1" dur="10s" repeatCount="indefinite"/></rect>
  </g>
</svg>
