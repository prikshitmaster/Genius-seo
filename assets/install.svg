<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Install genius-seo</title>
  <desc id="d">Two commands, then vet your first keyword. The terminal types each command and a verdict card stamps GO.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040b08"/><stop offset=".65" stop-color="#08190f"/><stop offset="1" stop-color="#0d2c20"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3ee6b0" stroke-opacity=".055"/></pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2fff8"/><stop offset=".6" stop-color="#d9ffc0"/><stop offset="1" stop-color="#b6f23c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      @keyframes stamp{0%,70%{opacity:0;transform:scale(2.2) rotate(-18deg)}76%{opacity:1;transform:scale(1) rotate(-8deg)}96%{opacity:1;transform:scale(1) rotate(-8deg)}100%{opacity:0}}
      .stamp{transform-box:fill-box;transform-origin:center;animation:stamp 10s ease-out infinite}
      @keyframes rows{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}
      .rows{animation:rows 10s infinite}
      @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
      .caret{animation:caret 1s steps(1) infinite}
    </style>
    <clipPath id="l1"><rect x="96" y="120" height="24" width="0"><animate attributeName="width" values="0;0;560;560" keyTimes="0;.02;.18;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l2"><rect x="96" y="180" height="24" width="0"><animate attributeName="width" values="0;0;560;560" keyTimes="0;.26;.42;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="96" y="240" height="24" width="0"><animate attributeName="width" values="0;0;560;560" keyTimes="0;.5;.62;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#vig)"/>

  <text x="60" y="46" class="mono" font-size="12" letter-spacing="3" fill="#b6f23c">INSTALL</text>
  <text x="60" y="78" class="sans" font-size="28" font-weight="800" fill="#eafff4">Two commands, then vet your first keyword</text>

  <!-- terminal -->
  <rect x="60" y="92" width="660" height="230" rx="6" fill="#0d2019" stroke="#2c5a47" stroke-width="2"/>
  <g transform="translate(60,92)">
    <rect width="660" height="26" rx="6" fill="#12291f"/>
    <rect x="14" y="9" width="9" height="9" fill="#ff6b5a"/><rect x="30" y="9" width="9" height="9" fill="#ffb020"/><rect x="46" y="9" width="9" height="9" fill="#3ee6b0"/>
    <text x="330" y="18" class="mono" font-size="11" fill="#6f9c86" text-anchor="middle">claude  ~/your-site</text>
  </g>

  <g class="mono" font-size="15">
    <text x="78" y="138" fill="#b6f23c">&gt;</text>
    <text x="96" y="138" fill="#eafff4" clip-path="url(#l1)">/plugin marketplace add prikshitmaster/Genius-seo</text>
    <text x="96" y="160" font-size="12" fill="#3ee6b0" opacity="0">✓ marketplace added<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.2;.21;.97;1" dur="10s" repeatCount="indefinite"/></text>

    <text x="78" y="198" fill="#b6f23c">&gt;</text>
    <text x="96" y="198" fill="#eafff4" clip-path="url(#l2)">/plugin install genius-seo@genius-seo</text>
    <text x="96" y="220" font-size="12" fill="#3ee6b0" opacity="0">✓ 1 skill, 12 commands, 1 agent installed<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.44;.45;.97;1" dur="10s" repeatCount="indefinite"/></text>

    <text x="78" y="258" fill="#b6f23c">&gt;</text>
    <text x="96" y="258" fill="#eafff4" clip-path="url(#l3)">/genius-seo:vet &quot;opt job search&quot;</text>
    <text x="96" y="280" font-size="12" fill="#3ee6b0" opacity="0">✓ 6 checks run → verdict ready<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.65;.97;1" dur="10s" repeatCount="indefinite"/></text>
    <rect class="caret" x="96" y="292" width="9" height="16" fill="#b6f23c"/>
  </g>

  <!-- verdict card -->
  <g transform="translate(760,92)">
    <rect width="380" height="230" rx="4" fill="#eef7e2"/>
    <rect x="10" y="10" width="360" height="210" fill="none" stroke="#07120e" stroke-width="2"/>
    <text x="190" y="36" class="mono" font-size="11" letter-spacing="3" fill="#07120e" text-anchor="middle">SEO-KEYWORD-SCOUT</text>
    <rect x="24" y="46" width="332" height="3" fill="#07120e"/>
    <text x="190" y="76" class="sans" font-size="20" font-weight="800" fill="#07120e" text-anchor="middle">&quot;opt job search&quot;</text>
    <g class="rows mono" font-size="12" fill="#1d3a2e">
      <text x="32" y="108">Business    3/3 → /services/job-applications</text>
      <text x="32" y="130">Intent      blog guide ✓</text>
      <text x="32" y="152">Compete     3 of 4 yes</text>
      <text x="32" y="174">AI filter   aim for brand mention</text>
      <text x="32" y="196">Fan-out     5 sub-questions → H2s</text>
    </g>
    <g class="stamp" filter="url(#soft)">
      <rect x="226" y="120" width="120" height="58" fill="none" stroke="#d62f1f" stroke-width="4"/>
      <text x="286" y="162" class="sans" font-size="34" font-weight="900" letter-spacing="4" fill="#d62f1f" text-anchor="middle">GO</text>
    </g>
  </g>
</svg>
