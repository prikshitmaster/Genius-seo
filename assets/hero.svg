<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">genius-seo</title>
  <desc id="d">SEO and AEO plugin for Claude Code. Rank in Google, get cited by AI. Pixel crawler bots walk across while a magnifier scans Google, ChatGPT, YouTube and Reddit.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040b08"/><stop offset=".65" stop-color="#08190f"/><stop offset="1" stop-color="#0d2c20"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3ee6b0" stroke-opacity=".055"/></pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2fff8"/><stop offset=".6" stop-color="#d9ffc0"/><stop offset="1" stop-color="#b6f23c"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="bot" viewBox="0 0 32 32">
      <rect x="14" y="0" width="4" height="4" fill="currentColor"/>
      <rect x="4" y="4" width="24" height="16" fill="currentColor"/>
      <rect x="9" y="9" width="4" height="5" fill="#07120e"/>
      <rect x="19" y="9" width="4" height="5" fill="#07120e"/>
      <g class="legA"><rect x="2" y="20" width="4" height="8" fill="currentColor"/><rect x="18" y="20" width="4" height="8" fill="currentColor"/></g>
      <g class="legB"><rect x="10" y="20" width="4" height="8" fill="currentColor"/><rect x="26" y="20" width="4" height="8" fill="currentColor"/></g>
    </symbol>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .star{animation:tw 3.2s ease-in-out infinite}
      @keyframes walk{from{transform:translateX(-60px)}to{transform:translateX(1260px)}}
      .walker{animation:walk 20s linear infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      .bob{animation:bob .6s steps(2) infinite}
      @keyframes legs{0%,49%{opacity:1}50%,100%{opacity:0}}
      .legA{animation:legs .6s infinite}
      .legB{animation:legs .6s infinite reverse}
      @keyframes lit{0%,19%{opacity:1}20%,100%{opacity:0}}
      .chipOn{opacity:0;animation:lit 10s infinite}
      @keyframes dash{to{stroke-dashoffset:-40}}
      .link{stroke-dasharray:4 6;animation:dash 2s linear infinite}
      @keyframes scan{
        0%,12%{transform:translate(760px,70px)}
        25%,37%{transform:translate(905px,52px)}
        50%,62%{transform:translate(985px,172px)}
        75%,87%{transform:translate(1120px,190px)}
        100%{transform:translate(760px,70px)}}
      .lens{animation:scan 12s ease-in-out infinite}
      @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
      .glow{animation:glow 1.6s ease-in-out infinite}
      @keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
      .caret{animation:caret 1s steps(1) infinite}
      @keyframes ping{0%{transform:scale(.6);opacity:0}30%{opacity:1}100%{transform:scale(1.6);opacity:0}}
      .ping{transform-box:fill-box;transform-origin:center;animation:ping 3s ease-out infinite}
    </style>
    <clipPath id="type"><rect x="72" y="208" height="30" width="0">
      <animate attributeName="width" values="0;0;330;330" keyTimes="0;.08;.45;1" dur="7s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#vig)"/>

  <!-- stars -->
  <g fill="#9fe6c4">
    <rect class="star" x="420" y="40" width="3" height="3"/>
    <rect class="star" x="560" y="96" width="3" height="3" style="animation-delay:-1s"/>
    <rect class="star" x="660" y="30" width="3" height="3" style="animation-delay:-2s"/>
    <rect class="star" x="1170" y="40" width="3" height="3" style="animation-delay:-.5s"/>
    <rect class="star" x="700" y="330" width="3" height="3" style="animation-delay:-1.5s"/>
    <rect class="star" x="360" y="300" width="3" height="3" style="animation-delay:-2.5s"/>
    <rect class="star" x="30" y="30" width="3" height="3" style="animation-delay:-.8s"/>
  </g>

  <!-- left: title block -->
  <text x="56" y="62" class="mono" font-size="12" letter-spacing="3" fill="#b6f23c">SEO + AEO PLUGIN FOR CLAUDE CODE</text>
  <text x="54" y="128" class="sans" font-size="62" font-weight="800" fill="url(#ink)" filter="url(#soft)">genius-seo</text>
  <g transform="translate(392,86)" fill="#b6f23c" filter="url(#glow)">
    <rect x="12" y="0" width="6" height="30"/><rect x="0" y="12" width="30" height="6"/>
    <rect x="4" y="4" width="5" height="5"/><rect x="21" y="4" width="5" height="5"/>
    <rect x="4" y="21" width="5" height="5"/><rect x="21" y="21" width="5" height="5"/>
  </g>
  <text x="56" y="166" class="sans" font-size="21" font-weight="600" fill="#eafff4">Rank in Google. <tspan fill="#3ee6b0">Get cited by AI.</tspan></text>

  <rect x="56" y="200" width="380" height="44" rx="4" fill="#0d2019" stroke="#2c5a47" stroke-width="2"/>
  <text x="72" y="228" class="mono" font-size="15" fill="#3ee6b0" clip-path="url(#type)">&gt; /genius-seo:vet &quot;opt job search&quot;</text>
  <rect class="caret" x="408" y="214" width="9" height="18" fill="#b6f23c"/>

  <!-- pipeline chips -->
  <g class="mono" font-size="11" letter-spacing="2" text-anchor="middle">
    <g fill="none" stroke="#2c5a47" stroke-width="2">
      <rect x="56" y="268" width="62" height="26"/><rect x="128" y="268" width="62" height="26"/>
      <rect x="200" y="268" width="66" height="26"/><rect x="276" y="268" width="62" height="26"/>
      <rect x="348" y="268" width="88" height="26"/>
    </g>
    <rect class="chipOn" x="56" y="268" width="62" height="26" fill="#b6f23c" fill-opacity=".22" stroke="#b6f23c" stroke-width="2"/>
    <rect class="chipOn" x="128" y="268" width="62" height="26" fill="#b6f23c" fill-opacity=".22" stroke="#b6f23c" stroke-width="2" style="animation-delay:2s"/>
    <rect class="chipOn" x="200" y="268" width="66" height="26" fill="#b6f23c" fill-opacity=".22" stroke="#b6f23c" stroke-width="2" style="animation-delay:4s"/>
    <rect class="chipOn" x="276" y="268" width="62" height="26" fill="#b6f23c" fill-opacity=".22" stroke="#b6f23c" stroke-width="2" style="animation-delay:6s"/>
    <rect class="chipOn" x="348" y="268" width="88" height="26" fill="#b6f23c" fill-opacity=".22" stroke="#b6f23c" stroke-width="2" style="animation-delay:8s"/>
    <g fill="#9fc9b4">
      <text x="87" y="285">VET</text><text x="159" y="285">PLAN</text><text x="233" y="285">WRITE</text>
      <text x="307" y="285">CITE</text><text x="392" y="285">MEASURE</text>
    </g>
  </g>

  <!-- middle: AI answer card -->
  <g transform="translate(486,128)">
    <rect width="210" height="132" rx="4" fill="#0d2019" stroke="#3ee6b0" stroke-width="2"/>
    <text x="14" y="24" class="mono" font-size="11" letter-spacing="2" fill="#3ee6b0">AI ANSWER</text>
    <g fill="#2c5a47"><rect x="14" y="38" width="180" height="6"/><rect x="14" y="52" width="160" height="6"/><rect x="14" y="66" width="170" height="6"/></g>
    <rect class="glow" filter="url(#glow)" x="14" y="88" width="152" height="26" rx="3" fill="#b6f23c"/>
    <text x="24" y="105" class="mono" font-size="12" font-weight="700" fill="#07120e">[1] yourbrand.com</text>
  </g>
  <path class="link" d="M696 190 L760 110" stroke="#3ee6b0" stroke-width="2" fill="none"/>

  <!-- right: source graph -->
  <g stroke="#2c5a47" stroke-width="2" fill="none">
    <path class="link" d="M777 87 L922 69 L1002 189 L1137 207"/>
    <path class="link" d="M922 69 L1077 97 L1137 207"/>
    <path class="link" d="M777 87 L847 207 L1002 189"/>
    <path class="link" d="M847 207 L757 297 M1002 189 L1057 307"/>
  </g>
  <g class="mono" font-size="10" letter-spacing="2" fill="#6f9c86" text-anchor="middle">
    <g><rect x="760" y="70" width="34" height="34" fill="#0d2019" stroke="#b6f23c" stroke-width="2"/><text x="777" y="93" font-size="15" font-weight="700" fill="#b6f23c">G</text><text x="777" y="122">GOOGLE</text></g>
    <g><rect x="905" y="52" width="34" height="34" fill="#0d2019" stroke="#3ee6b0" stroke-width="2"/><text x="922" y="74" font-size="13" font-weight="700" fill="#3ee6b0">AI</text><text x="922" y="104">CHATGPT</text></g>
    <g><rect x="1060" y="80" width="34" height="34" fill="#0d2019" stroke="#3ee6b0" stroke-width="2"/><text x="1077" y="102" font-size="13" font-weight="700" fill="#3ee6b0">P</text><text x="1077" y="132">PERPLEXITY</text></g>
    <g><rect x="985" y="172" width="34" height="34" fill="#0d2019" stroke="#ffb020" stroke-width="2"/><path d="M997 181 L1010 189 L997 197 Z" fill="#ffb020"/><text x="1002" y="224">YOUTUBE</text></g>
    <g><rect x="1120" y="190" width="34" height="34" fill="#0d2019" stroke="#ffb020" stroke-width="2"/><text x="1137" y="212" font-size="14" font-weight="700" fill="#ffb020">r/</text><text x="1137" y="242">REDDIT</text></g>
    <g><rect x="830" y="190" width="34" height="34" fill="#0d2019" stroke="#b6f23c" stroke-width="2"/><g fill="#b6f23c"><rect x="838" y="199" width="18" height="3"/><rect x="838" y="205" width="14" height="3"/><rect x="838" y="211" width="16" height="3"/></g><text x="847" y="242">BLOG</text></g>
    <g><rect x="740" y="280" width="34" height="34" fill="#0d2019" stroke="#6f9c86" stroke-width="2"/><text x="757" y="302" font-size="11" font-weight="700" fill="#9fc9b4">.gov</text><text x="757" y="332">OFFICIAL</text></g>
    <g><rect x="1040" y="290" width="34" height="34" fill="#0d2019" stroke="#6f9c86" stroke-width="2"/><g fill="#9fc9b4"><rect x="1048" y="299" width="18" height="6"/><rect x="1048" y="309" width="18" height="3"/></g><text x="1057" y="342">NEWS</text></g>
  </g>

  <!-- scanning magnifier -->
  <g class="lens" filter="url(#soft)">
    <circle class="ping" cx="17" cy="17" r="26" fill="none" stroke="#b6f23c" stroke-width="2"/>
    <circle cx="17" cy="17" r="21" fill="#b6f23c" fill-opacity=".12" stroke="#ffb020" stroke-width="5"/>
    <rect x="33" y="33" width="8" height="20" fill="#ffb020" transform="rotate(-45 37 43)"/>
  </g>
  <text x="950" y="390" class="mono" font-size="10" letter-spacing="3" fill="#3ee6b0" text-anchor="middle">SCANNING SOURCES</text>

  <!-- ground + walking crawler bots -->
  <rect x="0" y="362" width="1200" height="2" fill="#2c5a47"/>
  <g transform="translate(0,330)">
    <g class="walker"><g class="bob"><use href="#bot" width="32" height="32" color="#b6f23c"/></g></g>
    <g class="walker" style="animation-delay:-7s"><g class="bob"><use href="#bot" width="32" height="32" color="#3ee6b0"/></g></g>
    <g class="walker" style="animation-delay:-14s"><g class="bob"><use href="#bot" width="32" height="32" color="#ffb020"/></g></g>
  </g>

  <text x="56" y="398" class="mono" font-size="10" letter-spacing="3" fill="#6f9c86">6 CHECKS · 12 COMMANDS · 8 GUIDES · MIT</text>
</svg>
